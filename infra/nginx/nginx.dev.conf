user nginx;
worker_processes auto;

pid /var/run/nginx.pid;

error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format dev
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time '
        'urt=$upstream_response_time '
        'upstream="$upstream_addr"';

    access_log /dev/stdout dev;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;

    client_max_body_size 10m;
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;

    # Docker's embedded DNS. Required because proxy_pass below uses variables
    # (resolved per request), otherwise: "no resolver defined to resolve web".
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        set $web_upstream http://web:3000;
        set $api_upstream http://api:4000;

        # Shared by every location below (inherited unless a location
        # defines its own proxy_set_header).

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;

        # Matches both /api and /api/... (a plain `location /api/` would
        # answer /api with a 301 redirect).
        location ~ ^/api(?:/|$) {
            proxy_pass $api_upstream;
 
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass $web_upstream;

            # Long timeouts for HMR websockets (next dev) and streamed responses.
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Useful for Next.js development and streaming responses.
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
