user nginx;
worker_processes auto;

pid /var/run/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;

    client_max_body_size 10m;
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;

    # Docker's embedded DNS. Required because `proxy_pass` below uses
    # variables: nginx then resolves `web` / `api` at request time (not only at
    # startup), so recreating those containers (new IP) does not cause 502.
    # Without this line every proxied request fails with
    # "no resolver defined to resolve web".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Next.js already compresses its own responses (nginx skips those);
    # this covers the API's JSON.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # If this nginx runs behind another proxy / load balancer, every
    # client shares that proxy's IP and this limit applies to all of them at
    # once. In that case configure `set_real_ip_from` and `real_ip_header`.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    server {
        listen 80 default_server;
        server_name _;

        set $web_upstream http://web:3000;
        set $api_upstream http://api:4000;

        # Do not use `add_header` inside a location block: as soon as a
        # location defines its own add_header, these server-level ones are dropped.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Was `Upgrade` + `Connection $connection_upgrade`, but the
        # `map` defining $connection_upgrade was removed, so nginx refused to
        # start. WebSocket is not needed in production, so just send no
        # Connection header (keeps upstream connections reusable).
        # If you add WebSocket later, bring back the `map` and the Upgrade header.
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Matches both /api and /api/... (a plain `location /api/` would
        # answer a request to /api with a 301 redirect to /api/)
        location ~ ^/api(?:/|$) {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass $api_upstream;
        }

        # Hashed build assets and optimized images: buffered, no streaming needed.
        location ^~ /_next/ {
            proxy_pass $web_upstream;
            proxy_hide_header X-Powered-By;
        }

        # Buffering is off here so streamed (Suspense / PPR) page
        # responses reach the browser as they are produced.
        location / {
            proxy_pass $web_upstream;
            proxy_hide_header X-Powered-By;

            proxy_buffering off;
        }
    }
}