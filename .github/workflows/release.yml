# Release on a tag `v*` (docs/11-environments-and-deployment.md, "Release"):
# build and push the images, then deploy over SSH (backup, migrate, up, health check, roll back).
#
# Secrets (repository or `production` environment):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS   the server
#   REGISTRY_TOKEN                                                  read:packages token for the server
# The production `.env` lives on the server in /srv/ddr and nowhere else.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The smoke test of docs/09 against a scratch stack built from this tag: the images are only
  # pushed, and nothing is deployed, when the daily flow works end to end.
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_EMAIL: smoke@example.test
      SMOKE_PASSWORD: smoke-password-1234
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost/api/health && break
            sleep 3
          done
          curl -fsS http://localhost/api/health
      - name: Migrate and create the smoke user
        run: |
          docker compose exec -T api bun dist/migrate.js
          docker compose exec -T -e ADMIN_EMAIL="$SMOKE_EMAIL" -e ADMIN_PASSWORD="$SMOKE_PASSWORD" api bun dist/seed-admin.js
      - name: Smoke test
        run: SMOKE_URL=http://localhost bun test infra/smoke
      - if: failure()
        run: docker compose logs --no-color --tail 200

  images:
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - id: repo
        # GHCR names are lower case.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the compose file, Nginx config and scripts
        run: |
          SSH="ssh -i ~/.ssh/id_deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          $SSH 'mkdir -p /srv/ddr'
          rsync -az -e "ssh -i ~/.ssh/id_deploy" docker-compose.prod.yml infra \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/ddr/
      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /srv/ddr && echo '${{ secrets.REGISTRY_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && infra/scripts/deploy.sh '${{ github.ref_name }}'"
