name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with `packageManager` in package.json and the Dockerfiles.
  BUN_VERSION: "1.4.4"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API (typecheck + test + build)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Throwaway database for the API's database tests. Keep the image in sync with
    # infra/docker/compose.dev.yml. The name must end in "_test" (see apps/api/test/preload.ts).
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daily_drilling_report_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run --filter @daily-mud-fluid-report/api typecheck

      # Fails when a *.schema.ts changed without its migration: generating again must produce
      # nothing new. Needs no database.
      - name: Check migrations are up to date
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "A schema changed without a migration. Run 'bun run db:generate' and commit it."
            git status --porcelain apps/api/drizzle
            exit 1
          fi

      # Unit tests, plus the database tests (auth, users, route permissions) against the
      # service above. test/preload.ts applies the migrations first.
      - name: Test
        run: bun run --filter @daily-mud-fluid-report/api test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daily_drilling_report_test

      - name: Build
        run: bun run api:build

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache Next.js build output between runs (see Next.js CI docs).
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Test
        run: bun run --filter @daily-mud-fluid-report/web test

      # `next build` also type-checks the whole web app.
      - name: Build
        run: bun run web:build

  # Single stable check to mark as "required" in branch protection, so the
  # job list above can change without editing repository settings.
  ci-success:
    name: CI success
    if: always()
    needs: [api, web]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "At least one job did not succeed."
              exit 1
            fi
          done
