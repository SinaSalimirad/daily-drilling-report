name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with `packageManager` in package.json and the Dockerfiles.
  BUN_VERSION: "1.4.4"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API (typecheck + build)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run --filter @daily-mud-fluid-report/api typecheck

      - name: Build
        run: bun run api:build

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache Next.js build output between runs (see Next.js CI docs).
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      # `next build` also type-checks the whole web app.
      - name: Build
        run: bun run web:build

  # Single stable check to mark as "required" in branch protection, so the
  # job list above can change without editing repository settings.
  ci-success:
    name: CI success
    if: always()
    needs: [api, web]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "At least one job did not succeed."
              exit 1
            fi
          done
