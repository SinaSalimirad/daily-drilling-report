name: Secret scan

# Fails the run when a commit contains something that looks like a secret
# (API keys, tokens, private keys, passwords in connection strings, ...).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full-history scan every weekend at 07:00 UTC.
    - cron: "0 7 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          # GITLEAKS_LICENSE is only required when this repository is owned
          # by a GitHub organization (free for personal accounts). Add it as
          # a repository secret and uncomment the next line if that applies.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
