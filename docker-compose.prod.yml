# Production stack (docs/11-environments-and-deployment.md). Images come from the registry,
# nothing is built on the server. Run it with infra/scripts/deploy.sh; the variables below are
# in /srv/ddr/.env on the server:
#   IMAGE_REPO (ghcr.io/<owner>/<repo>), TAG, DOMAIN, POSTGRES_USER, POSTGRES_PASSWORD,
#   POSTGRES_DB, BETTER_AUTH_SECRET, APP_ORIGIN (https://<DOMAIN>), LETSENCRYPT_EMAIL

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Not published to the host.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    image: ${IMAGE_REPO:?}/api:${TAG:?}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      APP_ORIGIN: ${APP_ORIGIN:?}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  web:
    image: ${IMAGE_REPO:?}/web:${TAG:?}
    restart: unless-stopped
    depends_on:
      - api
    logging: *logging

  nginx:
    image: nginx:1.30.6-trixie
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
      NGINX_CLIENT_MAX_BODY_SIZE: 2m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/prod:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api
      - web
    logging: *logging

  # Renews the certificate when it is due, twice a day; nginx reads the new files on its next reload.
  certbot:
    image: certbot/certbot:v4.2.0
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    logging: *logging

volumes:
  postgres-data:
  letsencrypt:
  certbot-webroot:
