# MASTER PROCESS
# Run Nginx worker processes as the unprivileged "nginx" user.
# This reduces the impact of a potential Nginx vulnerability.
user nginx;

# Automatically choose the number of worker processes based
# on the number of available CPU cores.
worker_processes auto;

# PID file used by Nginx for reload/stop operations.
pid /var/run/nginx.pid;

# Send Nginx error logs to Docker's stderr.
error_log /dev/stderr warn;


# ------------------------------------------------------------
# CONNECTION HANDLING
# ------------------------------------------------------------
events {

    # Maximum number of simultaneous connections handled
    # by EACH worker process.
    #
    # With worker_processes auto, the theoretical maximum is:
    #
    #   workers × 4096
    #
    # Example:
    #   4 CPU cores → up to ~16,384 worker connections.
    #
    # This is a connection limit, NOT a request-per-second limit.
    worker_connections 4096;


    # Linux high-performance event mechanism.
    #
    # epoll is designed for efficiently handling many
    # simultaneous network connections.
    use epoll;


    # Allow a worker to accept multiple new connections
    # when they arrive at the same time.
    #
    # This can improve connection acceptance under bursts
    # of traffic.
    multi_accept on;
}


# ============================================================
# HTTP
# ============================================================
http {

    # Load the standard MIME type database.
    #
    # Example:
    #
    #   .css  → text/css
    #   .js   → application/javascript
    #   .html → text/html
    #   .json → application/json
    #
    # This is mainly important when Nginx serves files directly.
    # It is still recommended in a reverse-proxy configuration.
    include /etc/nginx/mime.types;

    # MIME type used when Nginx cannot determine the content type.
    default_type application/octet-stream;


    # --------------------------------------------------------
    # PERFORMANCE
    # --------------------------------------------------------
    # Enables efficient kernel-assisted file transmission.
    #
    # Mostly useful when Nginx serves static files directly.
    # It does not hurt the reverse-proxy configuration.
    sendfile on;


    # Optimizes transmission of HTTP response packets.
    tcp_nopush on;


    # Disables unnecessary delays when sending small packets.
    #
    # Particularly useful for interactive traffic and APIs.
    tcp_nodelay on;


    # Keep client TCP connections alive for 65 seconds.
    #
    # This allows browsers to reuse the same TCP connection
    # instead of creating a new connection for every request.
    keepalive_timeout 65;


    # Maximum number of requests that can be sent through
    # one persistent client connection before Nginx closes it.
    #
    # 1000 is intentionally high because modern browsers
    # can reuse a connection for many requests.
    keepalive_requests 1000;


    # Size of the internal hash used for MIME types.
    #
    # 2048 is a safe value and prevents warnings when the
    # MIME type list is relatively large.
    types_hash_max_size 2048;


    # --------------------------------------------------------
    # LOGGING
    # --------------------------------------------------------
    # Custom access-log format.
    #
    # Important fields:
    #
    # $remote_addr             → real client IP
    # $request                 → HTTP request
    # $status                  → HTTP status code
    # $body_bytes_sent         → response size
    # $http_referer            → referring page
    # $http_user_agent         → browser/client
    # $request_time            → total request time
    # $upstream_response_time  → backend response time
    # $upstream_addr           → backend container
    #
    log_format main
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time '
    'urt=$upstream_response_time '
    'upstream="$upstream_addr"';


    # Docker-friendly logging.
    #
    # Docker captures stdout/stderr instead of requiring
    # log files inside the container.
    access_log /dev/stdout main;
    error_log /dev/stderr warn;


    # --------------------------------------------------------
    # GZIP COMPRESSION
    # --------------------------------------------------------
    # Enable gzip compression for supported responses.
    gzip on;


    # Compression level:
    #
    # 1  → fastest / less compression
    # 9  → slowest / maximum compression
    #
    # 5 is a good production compromise.
    gzip_comp_level 5;


    # Do not compress responses smaller than 1 KB.
    #
    # Compressing tiny responses can cost more CPU than
    # the bandwidth saved.
    gzip_min_length 1024;


    # Tell browsers/proxies that the response may differ
    # depending on whether gzip is supported.
    #
    # This is important for correct caching behavior.
    gzip_vary on;


    # Content types worth compressing.
    #
    # Images such as JPEG/WebP/PNG are intentionally absent
    # because they are already compressed.
    gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/xhtml+xml
    image/svg+xml;


    # Do not force gzip compression for responses received
    # from upstream proxy servers.
    #
    # ArvanCloud is already acting as the CDN/cache layer.
    # Keeping this OFF avoids unnecessary compression work
    # at the origin.
    gzip_proxied off;


    # --------------------------------------------------------
    # CLIENT LIMITS
    # --------------------------------------------------------
    # Maximum size of an HTTP request body.
    #
    # IMPORTANT:
    #
    # 10m = 10 MEGABYTES
    #
    # NOT megabits.
    #
    # Therefore:
    #
    # 10m ≈ 10 MB
    #
    client_max_body_size 10m;


    # Maximum time allowed to receive HTTP request headers.
    client_header_timeout 30s;


    # Maximum time allowed to receive the request body.
    #
    # Useful protection against very slow uploads.
    client_body_timeout 60s;


    # Maximum time allowed between successive writes
    # to the client.
    send_timeout 60s;


    # Allows Nginx to handle larger HTTP request headers.
    #
    # 4 buffers × 16 KB.
    #
    # Useful when applications use cookies or authentication
    # headers that make requests larger than normal.
    large_client_header_buffers 4 16k;


    # --------------------------------------------------------
    # RATE LIMITING
    # --------------------------------------------------------
    # General API rate limiter.
    #
    # $binary_remote_addr:
    #   identifies the client using its real IP address.
    #
    # zone=api:10m:
    #   allocates 10 MB of shared memory for tracking clients.
    #
    # rate=20r/s:
    #   allows an average of 20 requests per second per IP.
    #
    limit_req_zone
    $binary_remote_addr
    zone=api:10m
    rate=20r/s;


    # --------------------------------------------------------
    # WEBSOCKET SUPPORT
    # --------------------------------------------------------
    # WebSocket connections require:
    #
    #   Upgrade: websocket
    #   Connection: upgrade
    #
    # Normal HTTP requests should NOT receive
    # "Connection: upgrade".
    #
    # This map automatically chooses the correct value.
    map $http_upgrade $connection_upgrade {

        # WebSocket request
        default upgrade;

        # Normal HTTP request
        '' close;
    }


    # --------------------------------------------------------
    # UPSTREAM APPLICATIONS
    # --------------------------------------------------------
    # Next.js frontend container.
    upstream frontend {

        server web:3000;

        # Keep up to 32 idle persistent connections
        # from Nginx to the frontend container.
        #
        # This is NOT 32 users.
        #
        # It means Nginx can keep up to 32 reusable upstream
        # TCP connections available for future requests.
        #
        # This avoids repeatedly creating TCP connections
        # between Nginx and Next.js.
        keepalive 32;
    }


    # Elysia/Bun backend container.
    upstream backend {

        server api:4000;

        # Same concept as frontend.
        keepalive 32;
    }


    # --------------------------------------------------------
    # REAL CLIENT IP
    # --------------------------------------------------------
    # This prevents arbitrary Internet clients from spoofing
    # their IP address using X-Forwarded-For.
    # --------------------------------------------------------
    # ArvanCloud IPv4 ranges
    set_real_ip_from 185.143.232.0/22;
    set_real_ip_from 188.229.116.16/30;
    set_real_ip_from 94.101.182.0/27;
    set_real_ip_from 2.144.3.128/28;
    set_real_ip_from 37.32.16.0/27;
    set_real_ip_from 37.32.17.0/27;
    set_real_ip_from 37.32.18.0/27;
    set_real_ip_from 37.32.19.0/27;
    set_real_ip_from 185.215.232.0/22;
    set_real_ip_from 178.131.120.48/28;
    set_real_ip_from 94.101.183.0/28;
    set_real_ip_from 78.157.36.112/28;
    set_real_ip_from 95.38.61.80/28;


    # Use X-Forwarded-For to determine the original client IP.
    real_ip_header X-Forwarded-For;


    # Walk through the X-Forwarded-For chain and find the
    # first address that is NOT in the trusted ArvanCloud
    # ranges above.
    real_ip_recursive on;


    # --------------------------------------------------------
    # SECURITY HEADERS
    # --------------------------------------------------------
    # Prevent browsers from interpreting a response as a
    # different MIME type than the server specified.
    add_header X-Content-Type-Options "nosniff" always;


    # Prevent the website from being embedded inside an iframe.
    #
    # This helps protect against clickjacking.
    add_header X-Frame-Options "DENY" always;


    # Controls how much referrer information browsers send.
    add_header Referrer-Policy
    "strict-origin-when-cross-origin"
    always;


    # Disable browser APIs that your application does not need.
    #
    # If your application later needs camera, microphone or
    # geolocation, change these values.
    add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=()"
    always;


    # ========================================================
    # HTTP → HTTPS
    # ========================================================
    server {

        listen 80;
        listen [::]:80;

        server_name
        savaenergyco.ir
        www.savaenergyco.ir
        savaenergyco.com
        www.savaenergyco.com;


        # Redirect all HTTP requests to HTTPS.
        return 301 https://$host$request_uri;
    }


    # ========================================================
    # HTTPS SERVER
    # ========================================================
    server {

        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;


        server_name
        savaenergyco.ir
        www.savaenergyco.ir
        savaenergyco.com
        www.savaenergyco.com;


        # ----------------------------------------------------
        # TLS CERTIFICATE
        # ----------------------------------------------------
        # Origin certificate mounted into the container
        # through Docker secrets.
        ssl_certificate /run/secrets/origin_cert;
        ssl_certificate_key /run/secrets/origin_key;


        # Only modern TLS versions.
        ssl_protocols TLSv1.2 TLSv1.3;


        # Reuse TLS session information to reduce the cost
        # of repeated TLS handshakes.
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;


        # Disable TLS session tickets.
        #
        # This avoids relying on automatically generated
        # session-ticket keys and is a conservative security
        # configuration.
        ssl_session_tickets off;


        # ----------------------------------------------------
        # HSTS
        # ----------------------------------------------------
        # Tell browsers to use HTTPS for this domain for
        # the next 365 days.
        #
        # IMPORTANT:
        #
        # Only enable this when ALL subdomains are guaranteed
        # to support HTTPS.
        #
        add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;


        # ====================================================
        # FRONTEND
        # ====================================================
        location / {

            # Send the request to Next.js.
            proxy_pass http://frontend;


            # Use HTTP/1.1 between Nginx and Next.js.
            proxy_http_version 1.1;


            # Preserve the original hostname.
            proxy_set_header Host $host;


            # Pass the real client IP to Next.js.
            proxy_set_header X-Real-IP $remote_addr;


            # Preserve the proxy chain.
            proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;


            # Tell Next.js that the original connection
            # from the client was HTTPS.
            proxy_set_header X-Forwarded-Proto https;


            # WebSocket support.
            #
            # Normal HTTP requests get:
            #
            #   Connection: close
            #
            # WebSocket requests get:
            #
            #   Connection: upgrade
            #
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;


            # Maximum time to establish connection
            # to the Next.js container.
            proxy_connect_timeout 10s;


            # Maximum time allowed while sending data
            # to Next.js.
            proxy_send_timeout 60s;


            # Maximum time allowed while waiting for
            # Next.js to send data.
            proxy_read_timeout 60s;
        }


        # ====================================================
        # BACKEND API
        # ====================================================
        location /api/ {

            # Send API requests to Elysia/Bun.
            proxy_pass http://backend;


            # Use HTTP/1.1.
            proxy_http_version 1.1;


            # Preserve original hostname.
            proxy_set_header Host $host;


            # Pass real client IP.
            proxy_set_header X-Real-IP $remote_addr;


            # Preserve forwarding chain.
            proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;


            # Tell Elysia the original request used HTTPS.
            proxy_set_header X-Forwarded-Proto https;


            # WebSocket support.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;


            # Backend connection timeout.
            proxy_connect_timeout 10s;


            # Backend request send timeout.
            proxy_send_timeout 60s;


            # Backend response timeout.
            proxy_read_timeout 60s;


            # Basic flood protection.
            #
            # Allows an average of 20 requests/sec per client IP.
            #
            # burst=40 allows temporary bursts of additional
            # requests.
            #
            # nodelay means burst requests are processed
            # immediately rather than being artificially delayed.
            limit_req
            zone=api
            burst=40
            nodelay;
        }
    }
}